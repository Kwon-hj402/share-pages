<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#124e46">
  <meta name="description" content="운동과 혈관 기능 논문 네 편의 영어 초록 한글 번역, 핵심 리뷰, 필수 개념, 원문 PDF를 함께 읽는 자료실.">
  <title>운동과 혈관 기능 · 논문 읽기</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 이동</a>
  <aside class="sidebar" aria-label="논문 선택">
    <a class="brand" href="#moon"><span class="brand-mark" aria-hidden="true">V.</span><span>논문 읽기<small>EXERCISE & VASCULAR FUNCTION</small></span></a>
    <div class="library-heading"><span>READING LIBRARY</span><span>04</span></div>
    <nav id="paper-nav" aria-label="네 논문"></nav>
    <div class="side-divider"></div>
    <nav class="extra-nav" aria-label="공통 읽기 자료">
      <a href="#compare" data-route="compare"><span aria-hidden="true">↗</span> 네 논문 한눈에</a>
      <a href="#basics" data-route="basics"><span aria-hidden="true">⌘</span> 공통 사전 지식</a>
    </nav>
    <div class="sidebar-note"><span class="status-dot"></span> 원문과 나란히 읽기<p>요약의 쪽수를 누르면<br>해당 PDF 페이지로 이동합니다.</p></div>
    <footer class="sidebar-footer">연구 읽기 자료 · 2026.10.28<br>사용자가 제공한 PDF 4편 기준</footer>
  </aside>
  <main id="main" class="workspace" tabindex="-1">
    <header class="topbar"><span>운동생리학 <span class="crumb">/</span> 혈관 기능</span><div><span class="top-tag">READING ROOM</span><button id="layout-toggle" class="quiet-button" type="button">원문 넓게</button></div></header>
    <div id="paper-layout" class="paper-layout">
      <section class="reading-panel" aria-label="논문 해설">
        <div class="paper-heading" id="paper-heading"></div>
        <div class="tabs" role="tablist" aria-label="해설 선택">
          <button role="tab" id="tab-review" aria-controls="tab-content" aria-selected="true" data-tab="review">간단 리뷰</button>
          <button role="tab" id="tab-abstract" aria-controls="tab-content" aria-selected="false" data-tab="abstract" tabindex="-1">초록 번역</button>
          <button role="tab" id="tab-concepts" aria-controls="tab-content" aria-selected="false" data-tab="concepts" tabindex="-1">필수 개념</button>
        </div>
        <article id="tab-content" role="tabpanel" aria-labelledby="tab-review"></article>
      </section>
      <section class="pdf-panel" aria-label="원본 PDF 전체">
        <div class="pdf-toolbar"><div class="pdf-title"><span class="pdf-badge">PDF</span><span>원문 전체</span><span id="pdf-count" class="muted"></span></div><div class="pdf-actions"><a id="pdf-open" target="_blank" rel="noopener">새 창 ↗</a><a id="pdf-download" download>다운로드 ↓</a></div></div>
        <div class="pdf-controls"><div><button id="prev-page" aria-label="이전 PDF 페이지">‹</button><label for="page-number" class="sr-only">PDF 페이지</label><input id="page-number" type="number" min="1" value="1"><span id="page-total">/ –</span><button id="next-page" aria-label="다음 PDF 페이지">›</button></div><div><button id="zoom-out" aria-label="PDF 축소">−</button><span id="zoom-label">100%</span><button id="zoom-in" aria-label="PDF 확대">+</button></div></div>
        <div id="pdf-pages" class="pdf-pages" tabindex="0" aria-label="전체 PDF 페이지. 스크롤하여 읽기"><p class="pdf-status" role="status">원문을 불러오는 중입니다.</p></div>
        <div class="pdf-foot">쪽수는 인쇄 쪽수가 아닌 <strong>PDF 파일의 순서</strong>입니다. 모든 페이지를 스크롤해 볼 수 있습니다.</div>
      </section>
    </div>
    <article id="shared-view" class="shared-view" hidden></article>
  </main>
  <div id="announcement" class="sr-only" aria-live="polite"></div>
  <noscript><p>논문 선택과 PDF 보기를 위해 JavaScript를 켜 주세요. <a href="papers/moon.pdf">필라테스 원문</a> · <a href="papers/ku.pdf">서킷 원문</a> · <a href="papers/ryu.pdf">스프린트 원문</a> · <a href="papers/yebin.pdf">초미세먼지 원문</a></p></noscript>
  <script src="data.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
