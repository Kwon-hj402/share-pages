<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="watson-stats-mixed-overview-title"><title id="watson-stats-mixed-overview-title">혼합효과모형의 식을 한 항씩 조립</title><defs><marker id="watson-stats-mixed-overview-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5.6" markerHeight="5.6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="#245d7d"/></marker></defs><rect width="1200" height="660" fill="white"/><text x="65" y="80" font-size="32" fill="#151515" text-anchor="start" font-weight="400">보행 속도</text><text x="250" y="80" font-size="42" fill="#151515" text-anchor="start" font-weight="400">yᵢⱼ =</text><g data-step="1" ><text x="420" y="80" font-size="46" fill="#245d7d" text-anchor="middle" font-weight="600">β₀</text><line x1="420" y1="100" x2="420" y2="160" stroke="#245d7d" stroke-width="2" /><text x="420" y="198" font-size="28" fill="#245d7d" text-anchor="middle" font-weight="400">전체 기준 출발점</text></g><g data-step="2" ><text x="555" y="80" font-size="42" fill="#151515" text-anchor="start" font-weight="400">+ βP Zᵢ</text><text x="800" y="80" font-size="42" fill="#151515" text-anchor="start" font-weight="400">+ βt tᵢⱼ</text><line x1="635" y1="100" x2="635" y2="235" stroke="#555" stroke-width="2" /><line x1="880" y1="100" x2="880" y2="235" stroke="#555" stroke-width="2" /><text x="635" y="275" font-size="28" fill="#151515" text-anchor="middle" font-weight="400">PWV 수준 차이</text><text x="880" y="275" font-size="28" fill="#151515" text-anchor="middle" font-weight="400">기준 시간 변화율</text></g><g data-step="3" ><text x="170" y="380" font-size="42" fill="#245d7d" text-anchor="start" font-weight="400">+ βPt Zᵢtᵢⱼ</text><text x="170" y="430" font-size="28" fill="#245d7d" text-anchor="start" font-weight="400">PWV가 시간 기울기를 바꾸는 항</text></g><g data-step="4" ><text x="700" y="380" font-size="42" fill="#151515" text-anchor="start" font-weight="400">+ b₀ᵢ + b₁ᵢtᵢⱼ</text><text x="700" y="430" font-size="28" fill="#151515" text-anchor="start" font-weight="400">개인별 출발점 + 개인별 기울기</text></g><g data-step="5" ><text x="170" y="530" font-size="36" fill="#151515" text-anchor="start" font-weight="400">+ 공변량 항 + εᵢⱼ</text><text x="600" y="590" font-size="27" fill="#555" text-anchor="middle" font-weight="400">i = 사람 / j = 방문 / Z = 기저 PWV를 1SD 단위로 표현</text></g><text x="600" y="638" font-size="25" fill="#555" text-anchor="middle" font-weight="400">개념 설명용 가상 예시 · 실제 관측값/예측선 아님</text></svg>