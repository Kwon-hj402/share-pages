<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="watson-stats-pwv-time-product-title"><title id="watson-stats-pwv-time-product-title">고정된 PWV와 시간이 만드는 곱</title><defs><marker id="watson-stats-pwv-time-product-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5.6" markerHeight="5.6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="#245d7d"/></marker></defs><rect width="1200" height="660" fill="white"/><text x="230" y="70" font-size="30" fill="#151515" text-anchor="middle" font-weight="400">기저 PWV는 같은 값으로 유지</text><text x="230" y="145" font-size="29" fill="#151515" text-anchor="middle" font-weight="400">처음 측정한 값</text><text x="230" y="265" font-size="32" fill="#245d7d" text-anchor="middle" font-weight="600">A: 600 cm/s</text><text x="230" y="395" font-size="32" fill="#245d7d" text-anchor="middle" font-weight="600">B: 1,000 cm/s</text><line x1="70" y1="180" x2="1140" y2="180" stroke="#151515" stroke-width="2" /><line x1="70" y1="320" x2="1140" y2="320" stroke="#d0d0d0" stroke-width="1.2" /><line x1="70" y1="450" x2="1140" y2="450" stroke="#151515" stroke-width="2" /><line x1="390" y1="110" x2="390" y2="450" stroke="#d0d0d0" stroke-width="1.2" /><line x1="640" y1="110" x2="640" y2="450" stroke="#d0d0d0" stroke-width="1.2" /><line x1="890" y1="110" x2="890" y2="450" stroke="#d0d0d0" stroke-width="1.2" /><g data-step="1" ><text x="515" y="145" font-size="32" fill="#151515" text-anchor="middle" font-weight="400">t = 0</text><text x="515" y="265" font-size="28" fill="#151515" text-anchor="middle" font-weight="400">600 × 0 = 0</text><text x="515" y="395" font-size="27" fill="#151515" text-anchor="middle" font-weight="400">1,000 × 0 = 0</text></g><g data-step="2" ><text x="765" y="145" font-size="32" fill="#151515" text-anchor="middle" font-weight="400">t = 4</text><text x="765" y="265" font-size="28" fill="#151515" text-anchor="middle" font-weight="400">600 × 4</text><text x="765" y="305" font-size="30" fill="#245d7d" text-anchor="middle" font-weight="400">= 2,400</text><text x="765" y="395" font-size="28" fill="#151515" text-anchor="middle" font-weight="400">1,000 × 4</text><text x="765" y="435" font-size="30" fill="#245d7d" text-anchor="middle" font-weight="400">= 4,000</text></g><g data-step="3" ><text x="1015" y="145" font-size="32" fill="#151515" text-anchor="middle" font-weight="400">t = 7</text><text x="1015" y="265" font-size="28" fill="#151515" text-anchor="middle" font-weight="400">600 × 7</text><text x="1015" y="305" font-size="30" fill="#245d7d" text-anchor="middle" font-weight="400">= 4,200</text><text x="1015" y="395" font-size="28" fill="#151515" text-anchor="middle" font-weight="400">1,000 × 7</text><text x="1015" y="435" font-size="30" fill="#245d7d" text-anchor="middle" font-weight="400">= 7,000</text></g><g data-step="4" ><path d="M430.00 490.00 L1110.00 490.00" fill="none" stroke="#245d7d" stroke-width="3" pathLength="100" class="ls-draw" marker-end="url(#watson-stats-pwv-time-product-arrow)"/><text x="600" y="550" font-size="32" fill="#245d7d" text-anchor="middle" font-weight="600">PWV는 고정 / 시간이 증가 → PWV×시간은 변화</text><text x="600" y="590" font-size="24" fill="#555" text-anchor="middle" font-weight="400">원단위 곱셈 예시 / 실제 모형은 중심화·1SD 단위로 설명</text></g><text x="600" y="638" font-size="25" fill="#555" text-anchor="middle" font-weight="400">개념 설명용 가상 예시 · 실제 관측값/예측선 아님</text></svg>