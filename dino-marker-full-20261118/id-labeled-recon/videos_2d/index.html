<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2D 마커 ID 확인</title><style>body{font:16px system-ui;background:#111a27;color:#eef3fa;margin:24px}main{max-width:1500px;margin:auto}button{padding:10px 20px;margin:5px;background:#263c56;color:white;border:1px solid #6d89a9;border-radius:6px}video{width:100%;background:#070c12}p{line-height:1.7;color:#c2cfdf}a{color:#a4d9ff}</style><main><p><a href="../index.html">← ID 분석 보고서</a> · <a href="../named_3d/named_markers_3d.html">같은 구간의 ID 3D</a></p><h1>2D 마커 이름 · 카메라별 확인</h1><p>같은 이름은 모든 카메라에서 같은 색입니다. 회색은 ID가 확인되지 않은 검출점입니다. 왼쪽 전체 영상, 오른쪽 실제 영상 확대입니다. 기준 기록에서 이식한 ID와 추적해 추정한 ID를 구분합니다.</p><div><button onclick="show(1)">CAM 1</button><button onclick="show(2)">CAM 2</button><button onclick="show(3)">CAM 3</button><button onclick="show(4)">CAM 4</button><button onclick="show(5)">CAM 5</button><button onclick="show(6)">CAM 6</button><button onclick="show(7)">CAM 7</button><button onclick="show(8)">CAM 8</button></div><video id="video" controls playsinline preload="metadata" src="camera01_ids.mp4" poster="camera01_ref141.jpg"></video><p>현재 보던 클립의1~3.5초 · REF90–164 · 75프레임 · 약2.50초. 아래 영상의 원본 프레임 번호는 카메라 동기화 오프셋을 포함합니다.</p><a href="id_video_stats.json">프레임별 검출·ID 집계</a></main><script>const v=document.getElementById('video');function show(c){const t=v.currentTime||0,p=!v.paused;v.pause();v.src=`camera${String(c).padStart(2,'0')}_ids.mp4`;v.poster=`camera${String(c).padStart(2,'0')}_ref141.jpg`;v.onloadedmetadata=()=>{v.currentTime=Math.min(t,v.duration-0.01);if(p)v.play().catch(()=>{})};v.load()}</script></html>
